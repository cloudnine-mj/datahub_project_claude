# ── Pipeline Workflow ────────────────────────────────────────────────────────
#
# 파이프라인 생성 규칙 (중복 방지 + feature 브랜치 MR pipeline 자동 생성):
#   • MR 이벤트 (feature 브랜치 push + MR 존재) → detached merge request pipeline
#   • 기본 브랜치(develop/staging/main) push   → branch pipeline
#   • v* 태그 push                              → tag pipeline (build:release 트리거)
#   • MR 이 있는 feature 브랜치 직접 push       → MR pipeline 만 (중복 방지)
#   • MR 이 없는 feature 브랜치 직접 push       → pipeline 생성 안 됨 (의도적)
#
# 이 룰이 없으면 feature 브랜치에 대한 MR pipeline 이 자동 생성되지 않아
# `merge_when_pipeline_succeeds` 가 영원히 대기하는 회귀가 발생한다.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^(develop|staging|main)$/ && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build
  - publish

default:
  tags:
    - datahub-k8s

# ── 버전 전략 ────────────────────────────────────────────────────────────────
#
#  브랜치/태그       패키지 버전 예시              환경
#  develop          0.10.12.dev{pipeline_iid}    dev
#  staging          0.10.12rc{pipeline_iid}      stg
#  main / v* 태그   0.10.12                      prd
#
#  GitLab Package Registry 동일 프로젝트에 세 버전이 공존.
#  설치 예:
#    pip install lgair-datahub             # prd (latest stable)
#    pip install "lgair-datahub>=0.10.12rc1,<0.11"  # stg RC
#    pip install "lgair-datahub>=0.10.12.dev1"       # dev snapshot

# ── Test ─────────────────────────────────────────────────────────────────────

test:unit:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -e ".[dev]" --quiet
    - python -m pytest tests/ -v --tb=short --ignore=tests/e2e
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "main"'

test:smoke:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -e . --quiet
    - datahub --version
    - datahub --help
    - python -c "from datahub.client import DataClient; print('DataClient OK')"
    - python -c "from datahub.console import console, success, error; success('smoke test passed')"
    - python -c "import httpx; c = httpx.Client(base_url='http://localhost', timeout=120.0, verify=False); c.close(); print('httpx OK')"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Build (공통 템플릿) ────────────────────────────────────────────────────────

.build_common: &build_common
  stage: build
  image: python:3.12-slim
  before_script:
    - pip install build --quiet
  script:
    - |
      # pyproject.toml 버전 패치 (VERSION_SUFFIX 환경변수 기반)
      python - <<'PYEOF'
      import re, os
      suffix = os.environ.get("VERSION_SUFFIX", "")
      content = open("pyproject.toml").read()
      base = re.search(r'^version\s*=\s*"([^"]+)"', content, re.M).group(1)
      # base가 이미 .dev/.rc 포함 시 제거 후 suffix 적용
      base = re.sub(r'\.(dev|rc)\d+$', '', base)
      new_ver = f"{base}{suffix}"
      content = re.sub(r'^version\s*=\s*"[^"]+"', f'version = "{new_ver}"', content, flags=re.M)
      open("pyproject.toml", "w").write(content)
      print(f"[build] version → {new_ver}")
      PYEOF
    - |
      # _defaults.py — 브랜치별 기본 endpoint 주입
      python - <<'PYEOF'
      import os
      branch = os.environ.get("CI_COMMIT_BRANCH", "")
      endpoint_map = {
          "develop": "https://api-dev.datahub.lgair-data.com",
          "staging": "https://api-stg.datahub.lgair-data.com",
      }
      endpoint = endpoint_map.get(branch, "https://api.datahub.lgair-data.com")
      content = (
          "# Auto-generated by CI at build time — do not edit manually.\n"
          f'DEFAULT_ENDPOINT = "{endpoint}"\n'
      )
      open("src/datahub/_defaults.py", "w").write(content)
      print(f"[build] DEFAULT_ENDPOINT → {endpoint} (branch={branch or 'tag/manual'})")
      PYEOF
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

build:dev:
  <<: *build_common
  variables:
    VERSION_SUFFIX: ".dev${CI_PIPELINE_IID}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

build:staging:
  <<: *build_common
  variables:
    VERSION_SUFFIX: "rc${CI_PIPELINE_IID}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'

build:release:
  <<: *build_common
  variables:
    VERSION_SUFFIX: ""
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Publish (공통 템플릿) ──────────────────────────────────────────────────────

.publish_common: &publish_common
  stage: publish
  image: python:3.12-slim
  before_script:
    - pip install twine --quiet
  script:
    # Self-signed cert: monkey-patch requests to skip SSL verification,
    # then invoke twine in the same process.
    - |
      TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token \
      python -c "
      import urllib3, sys, glob
      urllib3.disable_warnings()
      from requests.adapters import HTTPAdapter
      _orig = HTTPAdapter.send
      def _no_verify(self, request, **kw):
          kw['verify'] = False
          return _orig(self, request, **kw)
      HTTPAdapter.send = _no_verify
      sys.argv = ['twine', 'upload',
          '--repository-url', '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi',
      ] + glob.glob('dist/*')
      from twine.__main__ import main
      sys.exit(main())
      "

publish:dev:
  <<: *publish_common
  needs: ["build:dev"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

publish:staging:
  <<: *publish_common
  needs: ["build:staging"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'

publish:release:
  <<: *publish_common
  needs: ["build:release"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == "main"'
