[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lgair-datahub"
version = "0.12.0"
description = "LG AI Research DataHub SDK — data-platform-service thin client"
requires-python = ">=3.9"
license = "MIT"

dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "requests>=2.20.0",
    "rich>=13.0",
    "google-auth>=2.0.0",
    "google-cloud-storage>=2.0.0",
    "blake3>=1.0.0",
    "fastcdc>=1.3.0",
    # 사내 TLS 검사 프록시 (Zscaler 등) 환경에서 OS 키체인의 사설 CA 를 인식하도록
    # SSL 검증 경로를 OS 네이티브 트러스트로 교체. truststore 는 Python >=3.10 요구.
    # Python 3.9 사용자는 자동으로 받지 않으며, 그 경우 기존 certifi 동작 유지.
    'truststore>=0.10; python_version >= "3.10"',
]

[project.optional-dependencies]
fuse = [
    "fusepy>=3.0.1",
]
nfs = [
    # datahub-nfsd Rust 바이너리 배포 패키지 (플랫폼별 wheel) — 사내 GitLab
    # Package Registry(https://gitlab.lgresearch.ai/data-governance-public/datahub-nfsd)
    # 에서 배포되므로 로컬/외부망 환경에서는 설치 불가.
    # 사내망에서 NFS 마운트 기능을 사용할 때만 아래 줄을 활성화하세요:
    # "datahub-nfsd-bin>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
datahub = "datahub.cli:cli"
dh = "datahub.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/datahub"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: End-to-end tests requiring a live API server",
]

[dependency-groups]
dev = [
    "build>=1.4.0",
    "keyrings-google-artifactregistry-auth>=1.1.2",
    "twine>=6.2.0",
]
