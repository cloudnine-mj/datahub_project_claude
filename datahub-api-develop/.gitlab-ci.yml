# =============================================================================
# datahub-api — CI/CD
#
# 브랜치 → 환경 매핑 (스테이지는 클러스터 단위 물리 격리):
#   develop  → lgair-datahub-dev
#   staging  → lgair-datahub-stg
#   main     → lgair-datahub-prd
#
# 각 환경은 동일 Helm release 이름(`dh`) · 동일 네임스페이스(`lgair-datahub`)를
# 쓰되, 물리 클러스터 자체가 달라서 리소스는 완전히 분리된다.
#
# 시크릿은 GitLab CI/CD Variables + Environment scope(dev/stg/prd)로 관리한다.
# values-*.yaml 에는 평문 credential을 커밋하지 않는다.
# =============================================================================

# ── Pipeline Workflow ────────────────────────────────────────────────────────
#
# 파이프라인 생성 규칙 (중복 방지 + feature 브랜치 MR pipeline 자동 생성):
#   • MR 이벤트 (feature 브랜치 push + MR 존재) → detached merge request pipeline
#   • 기본 브랜치(develop/staging/main) push   → branch pipeline
#   • v* 태그 push                              → tag pipeline
#   • MR 이 있는 feature 브랜치 직접 push       → MR pipeline 만 (중복 방지)
#   • MR 이 없는 feature 브랜치 직접 push       → pipeline 생성 안 됨 (의도적)
#
# 이 룰이 없으면 feature 브랜치에 대한 MR pipeline 이 자동 생성되지 않아
# `merge_when_pipeline_succeeds` 가 영원히 대기하는 회귀가 발생한다.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^(develop|staging|main)$/ && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate
  - build
  - deploy

variables:
  GAR_HOST: "us-central1-docker.pkg.dev"
  GAR_REPOSITORY: "lgair-dg-data-hub/datahub"
  IMAGE_NAME: "platform"
  GCLOUD_PROJECT: "lgair-dg-data-hub"
  GCLOUD_REGION: "us-central1"
  K8S_NAMESPACE: "lgair-datahub"
  HELM_RELEASE: "dh"
  HELM_CHART: "deploy/helm/dp-chart"
  DOCKER_BUILD_CONTEXT: "."

default:
  tags:
    - datahub-k8s

# -----------------------------------------------------------------------------
# validate:scope-matrix — require_scope 부착 현황 (라우터 정의) 과
# architecture/scope-matrix.md 가 일치하는지 자동 검사 (architecture §2.5).
#
# drift 발생 시: dump 결과를 commit 에 포함시켜야 한다.
#   $ uv run python -m app.scripts.dump_scope_matrix -o architecture/scope-matrix.md
# -----------------------------------------------------------------------------
validate:scope-matrix:
  stage: validate
  image: python:3.12-slim
  before_script:
    - pip install --quiet uv
  script:
    - uv sync --quiet
    - uv run python -m app.scripts.dump_scope_matrix --check architecture/scope-matrix.md
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(develop|staging|main)$/ && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# -----------------------------------------------------------------------------
# build: Docker 이미지 빌드 + GAR 푸시
# 이미지 태그:
#   - $CI_COMMIT_SHA              (불변 레퍼런스)
#   - $IMAGE_TAG_ENV              (develop/staging/latest — helm values에서 참조)
# -----------------------------------------------------------------------------
.build_template:
  stage: build
  image: google/cloud-sdk:alpine
  services:
    - name: docker:27-dind
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: /certs/client
    DOCKER_BUILDKIT: 0
  before_script:
    - apk add --no-cache docker-cli
    - gcloud auth configure-docker $GAR_HOST --quiet
  script:
    - IMAGE_PATH="$GAR_HOST/$GAR_REPOSITORY/$IMAGE_NAME"
    - echo "Building $IMAGE_NAME ($CI_COMMIT_SHORT_SHA) tag=$IMAGE_TAG_ENV"
    - docker build --no-cache
        -t "$IMAGE_PATH:$CI_COMMIT_SHA"
        -t "$IMAGE_PATH:$IMAGE_TAG_ENV"
        "$DOCKER_BUILD_CONTEXT"
    - docker push "$IMAGE_PATH:$CI_COMMIT_SHA"
    - docker push "$IMAGE_PATH:$IMAGE_TAG_ENV"

build:develop:
  extends: .build_template
  variables:
    IMAGE_TAG_ENV: "develop"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

build:staging:
  extends: .build_template
  variables:
    IMAGE_TAG_ENV: "staging"
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'

build:main:
  extends: .build_template
  variables:
    IMAGE_TAG_ENV: "latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# -----------------------------------------------------------------------------
# deploy:db — 공유 PostgreSQL (db-chart) 배포 (governance#100)
# Namespace: lgair-datahub-db  /  Release: dh-db
#
# 필수 GitLab CI/CD Variables (Environment scope = dev/stg/prd):
#   POSTGRES_ADMIN_PW, PLATFORM_DB_PW, LAKEFS_DB_PW, UC_DB_PW, WEB_DB_PW
# -----------------------------------------------------------------------------
.deploy_db_template:
  stage: deploy
  image: google/cloud-sdk:alpine
  variables:
    DB_HELM_RELEASE: "dh-db"
    DB_K8S_NAMESPACE: "lgair-datahub-db"
    DB_HELM_CHART: "deploy/helm/db-chart"
  before_script:
    - apk add --no-cache curl bash kubectl
    - gcloud components install gke-gcloud-auth-plugin --quiet
    - curl -sSL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz | tar xz -C /tmp
    - install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
    - gcloud container clusters get-credentials "$GCLOUD_CLUSTER" --region "$GCLOUD_REGION" --project "$GCLOUD_PROJECT"
  script:
    - helm upgrade --install "$DB_HELM_RELEASE" "$DB_HELM_CHART"
        --namespace "$DB_K8S_NAMESPACE" --create-namespace
        --values "$DB_HELM_CHART/values.yaml"
        --values "$DB_HELM_CHART/$DB_VALUES_FILE"
        --set "postgresql.auth.postgresPassword=$POSTGRES_ADMIN_PW"
        --set "postgresql.auth.platformPassword=$PLATFORM_DB_PW"
        --set "postgresql.auth.lakefsPassword=$LAKEFS_DB_PW"
        --set "postgresql.auth.ucPassword=$UC_DB_PW"
        --set "postgresql.auth.webPassword=$WEB_DB_PW"
        --wait --timeout 10m

deploy:db:develop:
  extends: .deploy_db_template
  variables:
    GCLOUD_CLUSTER: "lgair-datahub-dev"
    DB_VALUES_FILE: "values-dev.yaml"
  environment:
    name: dev
    url: https://db-dev.datahub.lgair-data.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy:db:staging:
  extends: .deploy_db_template
  variables:
    GCLOUD_CLUSTER: "lgair-datahub-stg"
    DB_VALUES_FILE: "values-staging.yaml"
  environment:
    name: stg
    url: https://db-stg.datahub.lgair-data.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'

deploy:db:main:
  extends: .deploy_db_template
  variables:
    GCLOUD_CLUSTER: "lgair-datahub-prd"
    DB_VALUES_FILE: "values-prd.yaml"
  environment:
    name: prd
    url: https://db.datahub.lgair-data.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# -----------------------------------------------------------------------------
# deploy: helm upgrade --install (환경별 values + CI Variable 시크릿 --set 주입)
#
# governance#100 이후: PostgreSQL이 lgair-datahub-db 네임스페이스의 공유 인스턴스로 이관.
# DATABASE_URL을 CI에서 직접 구성해서 --set platform.secrets.DATABASE_URL 로 주입.
#
# 필수 GitLab CI/CD Variables (Environment scope = dev/stg/prd):
#   PLATFORM_DB_PW — platform DB 비밀번호 (DATABASE_URL 구성에 사용)
#   LAKEFS_DB_PW   — lakefs DB 비밀번호
#   JWT_SECRET, INTERNAL_SERVICE_SECRET
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#   LAKEFS_ACCESS_KEY_ID, LAKEFS_SECRET_ACCESS_KEY
#   LLM_API_KEY (선택)
#   MICROSOFT_CLIENT_ID, MICROSOFT_CLIENT_SECRET, MICROSOFT_TENANT_ID (선택)
#   GCP_SYSTEM_SA_EMAIL (선택)
# -----------------------------------------------------------------------------
.deploy_template:
  stage: deploy
  image: google/cloud-sdk:alpine
  before_script:
    - apk add --no-cache curl bash kubectl
    - gcloud components install gke-gcloud-auth-plugin --quiet
    - curl -sSL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz | tar xz -C /tmp
    - install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
    - gcloud container clusters get-credentials "$GCLOUD_CLUSTER" --region "$GCLOUD_REGION" --project "$GCLOUD_PROJECT"
    - helm repo add lakefs https://charts.lakefs.io && helm repo update
  script:
    - |
      # 공유 PostgreSQL cross-namespace URL (governance#100)
      DB_HOST="dh-db-postgresql.lgair-datahub-db.svc.cluster.local"
      PLATFORM_DATABASE_URL="postgresql://platform:${PLATFORM_DB_PW}@${DB_HOST}:5432/platform_db"

      # lakefs.lakefsConfig — 공유 PostgreSQL로 연결
      LAKEFS_CONFIG="database:
        type: postgres
        postgres:
          connection_string: postgres://lakefs:${LAKEFS_DB_PW}@${DB_HOST}:5432/lakefs_db?sslmode=disable
      blockstore:
        type: gs"
    # image.tag 를 커밋 SHA 로 강제 주입:
    # values 의 mutable tag(develop/staging/latest) 만 쓰면 GAR 에 새 이미지가
    # 푸시돼도 Deployment spec 이 동일해 K8s 가 rollout 을 트리거하지 않는다.
    # SHA 태그로 매번 spec 을 변화시켜 rolling update 를 보장.
    - helm upgrade --install "$HELM_RELEASE" "$HELM_CHART"
        --namespace "$K8S_NAMESPACE" --create-namespace
        --values "$HELM_CHART/values.yaml"
        --values "$HELM_CHART/$VALUES_FILE"
        --set "platform.image.tag=$CI_COMMIT_SHA"
        --set "platform.secrets.DATABASE_URL=$PLATFORM_DATABASE_URL"
        --set "platform.secrets.JWT_SECRET=$JWT_SECRET"
        --set "platform.secrets.INTERNAL_SERVICE_SECRET=$INTERNAL_SERVICE_SECRET"
        --set "platform.secrets.GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
        --set "platform.secrets.GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
        --set "platform.secrets.LAKEFS_ACCESS_KEY_ID=$LAKEFS_ACCESS_KEY_ID"
        --set "platform.secrets.LAKEFS_SECRET_ACCESS_KEY=$LAKEFS_SECRET_ACCESS_KEY"
        --set "platform.secrets.LLM_API_KEY=${LLM_API_KEY:-}"
        --set "platform.secrets.MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}"
        --set "platform.secrets.MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}"
        --set "platform.secrets.MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-}"
        --set "platform.config.GCP_SYSTEM_SA_EMAIL=${GCP_SYSTEM_SA_EMAIL:-}"
        --set-string "lakefs.lakefsConfig=$LAKEFS_CONFIG"
        --wait --timeout 10m
    - kubectl rollout status deployment "${HELM_RELEASE}-platform" -n "$K8S_NAMESPACE" --timeout=5m

deploy:develop:
  extends: .deploy_template
  variables:
    GCLOUD_CLUSTER: "lgair-datahub-dev"
    VALUES_FILE: "values-dev.yaml"
  environment:
    name: dev
    url: https://api-dev.datahub.lgair-data.com
  needs: ["build:develop", "deploy:db:develop"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy:staging:
  extends: .deploy_template
  variables:
    GCLOUD_CLUSTER: "lgair-datahub-stg"
    VALUES_FILE: "values-staging.yaml"
  environment:
    name: stg
    url: https://api-stg.datahub.lgair-data.com
  needs: ["build:staging", "deploy:db:staging"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'

deploy:main:
  extends: .deploy_template
  variables:
    GCLOUD_CLUSTER: "lgair-datahub-prd"
    VALUES_FILE: "values-prd.yaml"
  environment:
    name: prd
    url: https://api.datahub.lgair-data.com
  needs: ["build:main", "deploy:db:main"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
