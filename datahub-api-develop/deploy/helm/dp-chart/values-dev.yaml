# =============================================================================
# dev 환경 오버라이드 — lgair-datahub-dev 클러스터
# Cluster  : gke_lgair-dg-data-hub_us-central1_lgair-datahub-dev
# Namespace: lgair-datahub
# Helm     : release = dh, chart = dp-chart
# GCS      : bucket prefix = lgair-dgdh-dev
# 진입: https://api-dev.datahub.lgair-data.com (API)
#       https://dev.datahub.lgair-data.com     (웹, portal-chart)
#
# 시크릿은 모두 CI에서 --set으로 주입 (GitLab CI/CD Variables + environment scope=dev).
# values 파일에는 절대 평문 credential을 커밋하지 않는다.
# =============================================================================

platform:
  image:
    tag: develop               # CI가 develop 브랜치 빌드 시 이 태그를 push
  replicaCount: 1
  autoscaling:
    enabled: false
  config:
    FRONTEND_URL: "https://dev.datahub.lgair-data.com"
    OAUTH_REDIRECT_URI: "https://api-dev.datahub.lgair-data.com/api/v1/auth/callback"
    COOKIE_DOMAIN: ".datahub.lgair-data.com"
    GCP_BUCKET_PREFIX: "lgair-dgdh-dev"
  secrets: {}                  # CI에서 --set platform.secrets.* 로 주입
  ingress:
    enabled: true
    host: api-dev.datahub.lgair-data.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/limit-rps: "50"
      nginx.ingress.kubernetes.io/limit-connections: "100"
    tls:
      enabled: true
      secretName: "dh-platform-tls"
  externalService:
    enabled: false
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

redis:
  enabled: true

# 공유 PostgreSQL (dh-db)로 이관 — 인차트 PostgreSQL 비활성화 (governance#100)
# DATABASE_URL은 CI에서 --set platform.secrets.DATABASE_URL 로 주입
postgresql:
  enabled: false

unityCatalog:
  enabled: false

uploadSessionCleanup:
  enabled: false

lakefs:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
