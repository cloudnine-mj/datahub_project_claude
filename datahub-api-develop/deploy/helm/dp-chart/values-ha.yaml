postgresql:
  enabled: false

platform:
  replicaCount: 3
  metrics:
    podMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      additionalLabels: {}
    alerts:
      enabled: true
      duration: 10m
      errorRateThreshold: "0.05"
      latencyThresholdSeconds: "5"
      podRestartThreshold: "1"
      additionalLabels: {}
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  secrets:
    DATABASE_URL: "postgresql://platform:${PLATFORM_DB_PW}@${CLOUDSQL_HOST}:5432/platform_db"
    REDIS_URL: "redis://${REDIS_HOST}:6379/0"

lakefs:
  replicaCount: 2
  database:
    host: "${CLOUDSQL_HOST}"
    port: 5432
    name: "lakefs_db"
    user: "lakefs"
    password: "${LAKEFS_DB_PW}"
  lakefsConfig: |
    database:
      type: postgres
      postgres:
        connection_string: postgres://lakefs:${LAKEFS_DB_PW}@${CLOUDSQL_HOST}:5432/lakefs_db?sslmode=disable

unityCatalog:
  replicaCount: 2
  database:
    host: "${CLOUDSQL_HOST}"
    port: 5432
    name: "uc_db"
    user: "unitycatalog"
    password: "${UC_DB_PW}"

postgresqlBackup:
  enabled: true
  bucket: "datahub-postgresql-backups"
  host: "${CLOUDSQL_HOST}"
  port: 5432
