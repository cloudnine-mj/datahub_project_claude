# =============================================================================
# db-chart: DataHub 공유 PostgreSQL 기본값
# Namespace: lgair-datahub-db  (per-cluster)
# Helm release: dh-db
#
# 4개 데이터베이스를 단일 인스턴스에서 운영:
#   platform_db   — datahub-api (platform 서비스)
#   lakefs_db     — datahub-api (lakeFS)
#   uc_db         — datahub-api (Unity Catalog, 현재 disabled)
#   management_db — datahub web (Next.js BFF, 거버넌스 메타 + audit)
#
# 시크릿은 모두 CI에서 --set으로 주입 (GitLab CI/CD Variables).
# values 파일에 실제 비밀번호/자격증명 평문 커밋 절대 금지.
# =============================================================================

postgresql:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  # -- 인증 (비밀번호는 CI --set으로 주입, 여기서는 빈 문자열 placeholder)
  auth:
    postgresPassword: ""          # CI: POSTGRES_ADMIN_PW
    platformUser: platform
    platformPassword: ""          # CI: PLATFORM_DB_PW
    platformDatabase: platform_db
    lakefsUser: lakefs
    lakefsPassword: ""            # CI: LAKEFS_DB_PW
    lakefsDatabase: lakefs_db
    ucUser: unitycatalog
    ucPassword: ""                # CI: UC_DB_PW
    ucDatabase: uc_db
    webUser: management_admin
    webPassword: ""               # CI: WEB_DB_PW
    webDatabase: management_db

  persistence:
    enabled: true
    storageClass: standard-rwo
    size: 10Gi

  service:
    type: ClusterIP
    port: 5432
    annotations: {}

  # -- External LoadBalancer (디버깅·외부 접근용, 방화벽 필수)
  # 0.0.0.0/0 절대 사용 금지 — 허용 IP 대역만 명시할 것
  externalService:
    enabled: false
    port: 5432
    annotations: {}
    # ⚠️ 방화벽: 아래 CIDR만 PostgreSQL 외부 접근 허용
    # CI Variable (DB_ALLOWED_CIDRS) 주입 또는 환경별 values 파일에 실제 대역 명시
    loadBalancerSourceRanges:
      - "203.247.149.40/29"       # LG 사내망
      - "61.100.40.18/32"
      - "10.1.251.0/24"           # 내부 VPN
      - "165.85.218.127/32"
      - "165.85.218.128/32"
      - "140.209.203.20/32"
      - "140.209.203.114/32"
      - "134.231.208.126/32"
      - "134.231.208.21/32"
      - "210.98.176.131/32"
      - "34.56.23.209/32"         # GCP 내부 서비스
      - "34.69.21.196/32"
      - "34.44.90.1/32"
      - "35.222.144.28/32"
      - "35.222.221.89/32"
      - "34.170.180.252/32"
      - "10.128.0.0/16"           # VPC 내부

  # -- NetworkPolicy (lgair-datahub 네임스페이스 + lgair-datahub-db 내부만 허용)
  networkPolicy:
    enabled: true
    # 동일 네임스페이스 + 아래 namespaceSelector 허용
    allowFromNamespaces:
      - lgair-datahub

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
