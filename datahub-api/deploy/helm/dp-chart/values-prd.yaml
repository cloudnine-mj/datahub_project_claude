# =============================================================================
# prd 환경 오버라이드 — lgair-datahub-prd 클러스터
# Cluster  : gke_lgair-dg-data-hub_us-central1_lgair-datahub-prd
# Namespace: lgair-datahub
# Helm     : release = dh, chart = dp-chart
# GCS      : bucket prefix = lgair-dgdh-prd
# 진입: https://datahub.lgresearch.ai/api/v1
#
# 시크릿은 모두 CI에서 --set으로 주입 (GitLab CI/CD Variables + environment scope=prd).
# =============================================================================

platform:
  image:
    tag: latest                # main 빌드가 latest + CI_COMMIT_SHA 로 push
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  config:
    FRONTEND_URL: "https://datahub.lgresearch.ai"
    OAUTH_REDIRECT_URI: "https://datahub.lgresearch.ai/api/v1/auth/callback"
    COOKIE_DOMAIN: ".lgresearch.ai"
    GCP_BUCKET_PREFIX: "lgair-dgdh-prd"
    MCP_ENABLED: "false"
    OTEL_ENABLED: "false"
    RATE_LIMIT_WINDOW_SECONDS: "60"
    RATE_LIMIT_SESSION_REQUESTS: "60"
    RATE_LIMIT_TRANSFER_REQUESTS: "120"
  secrets: {}
  ingress:
    enabled: true
    host: datahub.lgresearch.ai
    path: "/api/v1"
    pathType: Prefix
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/limit-rps: "200"
      nginx.ingress.kubernetes.io/limit-connections: "400"
    tls:
      enabled: true
      secretName: "web-tls"
  externalService:
    enabled: true
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

# 공유 PostgreSQL (dh-db)로 이관 — 인차트 PostgreSQL 비활성화 (governance#100)
# DATABASE_URL은 CI에서 --set platform.secrets.DATABASE_URL 로 주입
postgresql:
  enabled: false

unityCatalog:
  enabled: false
