# =============================================================================
# staging 환경 오버라이드 — lgair-datahub-stg 클러스터
# Cluster  : gke_lgair-dg-data-hub_us-central1_lgair-datahub-stg
# Namespace: lgair-datahub
# Helm     : release = dh, chart = dp-chart
# GCS      : bucket prefix = lgair-dgdh-stg
# 진입: https://stg.datahub.lgair-data.com/api/v1
#
# 시크릿은 모두 CI에서 --set으로 주입 (GitLab CI/CD Variables + environment scope=stg).
# =============================================================================

platform:
  image:
    tag: staging
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  config:
    FRONTEND_URL: "https://stg.datahub.lgair-data.com"
    OAUTH_REDIRECT_URI: "https://stg.datahub.lgair-data.com/api/v1/auth/callback"
    COOKIE_DOMAIN: ".datahub.lgair-data.com"
    GCP_BUCKET_PREFIX: "lgair-dgdh-stg"
    MCP_ENABLED: "false"
    OTEL_ENABLED: "false"
  secrets: {}
  ingress:
    enabled: true
    host: stg.datahub.lgair-data.com
    path: "/api/v1"
    pathType: Prefix
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/limit-rps: "100"
      nginx.ingress.kubernetes.io/limit-connections: "200"
    tls:
      enabled: true
      secretName: "web-tls"
  externalService:
    enabled: false
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

redis:
  enabled: true

# 공유 PostgreSQL (dh-db)로 이관 — 인차트 PostgreSQL 비활성화 (governance#100)
# DATABASE_URL은 CI에서 --set platform.secrets.DATABASE_URL 로 주입
postgresql:
  enabled: false

unityCatalog:
  enabled: false
