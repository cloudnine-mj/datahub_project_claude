{{- if .Values.platform.enabled }}
# =============================================================================
# Platform — ConfigMap (비민감 설정)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-platform-config
  labels:
    app: {{ .Release.Name }}-platform
data:
  UC_ENDPOINT: {{ .Values.platform.config.UC_ENDPOINT | default "http://unity-catalog-disabled.local" | quote }}
  FRONTEND_URL: {{ .Values.platform.config.FRONTEND_URL | quote }}
  GCP_PROJECT: {{ .Values.platform.config.GCP_PROJECT | quote }}
  GCP_BUCKET_PREFIX: {{ .Values.platform.config.GCP_BUCKET_PREFIX | quote }}
  GCP_BUCKET_LOCATION: {{ .Values.platform.config.GCP_BUCKET_LOCATION | quote }}
  GCP_SYSTEM_SA_EMAIL: {{ .Values.platform.config.GCP_SYSTEM_SA_EMAIL | quote }}
  OAUTH_REDIRECT_URI: {{ .Values.platform.config.OAUTH_REDIRECT_URI | quote }}
  COOKIE_DOMAIN: {{ .Values.platform.config.COOKIE_DOMAIN | default "" | quote }}
  MCP_ENABLED: {{ .Values.platform.config.MCP_ENABLED | default "false" | quote }}
  OTEL_ENABLED: {{ .Values.platform.config.OTEL_ENABLED | default "false" | quote }}
  RATE_LIMIT_WINDOW_SECONDS: {{ .Values.platform.config.RATE_LIMIT_WINDOW_SECONDS | default "60" | quote }}
  RATE_LIMIT_SESSION_REQUESTS: {{ .Values.platform.config.RATE_LIMIT_SESSION_REQUESTS | default "60" | quote }}
  RATE_LIMIT_TRANSFER_REQUESTS: {{ .Values.platform.config.RATE_LIMIT_TRANSFER_REQUESTS | default "120" | quote }}
  DATAHUB_APP_VERSION: {{ .Values.platform.config.DATAHUB_APP_VERSION | default "" | quote }}
  DATAHUB_GIT_SHA: {{ .Values.platform.config.DATAHUB_GIT_SHA | default "" | quote }}
  DATAHUB_BUILD_REF: {{ .Values.platform.config.DATAHUB_BUILD_REF | default "" | quote }}
  DATAHUB_BUILD_PIPELINE: {{ .Values.platform.config.DATAHUB_BUILD_PIPELINE | default "" | quote }}
  DATAHUB_BUILD_TIME: {{ .Values.platform.config.DATAHUB_BUILD_TIME | default "" | quote }}
  GCS_KEY_PATH: {{ .Values.gcs.keyPath | quote }}

---
# =============================================================================
# Platform — Secret (민감 설정)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-platform-secret
  labels:
    app: {{ .Release.Name }}-platform
type: Opaque
stringData:
  {{- if .Values.platform.secrets.DATABASE_URL }}
  DATABASE_URL: {{ .Values.platform.secrets.DATABASE_URL | quote }}
  {{- else }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.platformUser .Values.postgresql.auth.platformPassword .Release.Name .Values.postgresql.auth.platformDatabase | quote }}
  {{- end }}
  {{- if .Values.platform.secrets.REDIS_URL }}
  REDIS_URL: {{ .Values.platform.secrets.REDIS_URL | quote }}
  {{- else if .Values.redis.enabled }}
  REDIS_URL: {{ printf "redis://%s-redis:6379/0" .Release.Name | quote }}
  {{- else }}
  REDIS_URL: ""
  {{- end }}
  JWT_SECRET: {{ .Values.platform.secrets.JWT_SECRET | quote }}
  INTERNAL_SERVICE_SECRET: {{ .Values.platform.secrets.INTERNAL_SERVICE_SECRET | quote }}
  {{- if .Values.platform.secrets.WEB_SERVICE_TOKEN }}
  # ServiceCallerMiddleware 정적 매핑 — Web BFF (datahub-web) 식별용.
  # 환경별 (dev/stg/prd) 다른 value 가 CI --set 으로 주입.
  # 미설정 시 Web BFF 호출은 service_caller=None 으로 처리 (CAB 채널).
  WEB_SERVICE_TOKEN: {{ .Values.platform.secrets.WEB_SERVICE_TOKEN | quote }}
  {{- end }}
  GOOGLE_CLIENT_ID: {{ .Values.platform.secrets.GOOGLE_CLIENT_ID | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.platform.secrets.GOOGLE_CLIENT_SECRET | quote }}
  MICROSOFT_CLIENT_ID: {{ .Values.platform.secrets.MICROSOFT_CLIENT_ID | quote }}
  MICROSOFT_CLIENT_SECRET: {{ .Values.platform.secrets.MICROSOFT_CLIENT_SECRET | quote }}
  MICROSOFT_TENANT_ID: {{ .Values.platform.secrets.MICROSOFT_TENANT_ID | quote }}
  # Azure AD SSO (governance §auth-and-api-keys §1.2 / api-specs/auth-api-spec §Azure AD OIDC)
  # 환경별 활성화는 GitLab CI Variables 의 env scope 에 AZURE_SSO_ENABLED=true +
  # AZURE_AD_TENANT_ID / CLIENT_ID / CLIENT_SECRET 을 등록해서 진행
  # (plan 2026-05-22-azure-sso-activation). 미등록 env 는 secret 이 비어 helm
  # template 가 env 주입 자체를 skip → config default false → 503
  # service_unavailable 유지.
  {{- if .Values.platform.secrets.AZURE_AD_TENANT_ID }}
  AZURE_AD_TENANT_ID: {{ .Values.platform.secrets.AZURE_AD_TENANT_ID | quote }}
  {{- end }}
  {{- if .Values.platform.secrets.AZURE_AD_CLIENT_ID }}
  AZURE_AD_CLIENT_ID: {{ .Values.platform.secrets.AZURE_AD_CLIENT_ID | quote }}
  {{- end }}
  {{- if .Values.platform.secrets.AZURE_AD_CLIENT_SECRET }}
  AZURE_AD_CLIENT_SECRET: {{ .Values.platform.secrets.AZURE_AD_CLIENT_SECRET | quote }}
  {{- end }}
  {{- if .Values.platform.secrets.AZURE_SSO_ENABLED }}
  AZURE_SSO_ENABLED: {{ .Values.platform.secrets.AZURE_SSO_ENABLED | quote }}
  {{- end }}
  {{- if .Values.platform.secrets.AZURE_ALLOWED_TENANTS }}
  AZURE_ALLOWED_TENANTS: {{ .Values.platform.secrets.AZURE_ALLOWED_TENANTS | quote }}
  {{- end }}
  {{- if .Values.platform.secrets.AZURE_ALLOWED_EMAIL_DOMAIN }}
  AZURE_ALLOWED_EMAIL_DOMAIN: {{ .Values.platform.secrets.AZURE_ALLOWED_EMAIL_DOMAIN | quote }}
  {{- end }}
  LLM_API_KEY: {{ .Values.platform.secrets.LLM_API_KEY | quote }}

---
# =============================================================================
# Platform — Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    app: {{ .Release.Name }}-platform
spec:
  replicas: {{ .Values.platform.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-platform
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-platform
      {{- if .Values.platform.metrics.enabled }}
      annotations:
        {{- toYaml .Values.platform.metrics.podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: platform
          image: "{{ .Values.platform.image.repository }}:{{ .Values.platform.image.tag }}"
          imagePullPolicy: {{ .Values.platform.image.pullPolicy }}
          ports:
            - name: {{ .Values.platform.metrics.portName }}
              containerPort: {{ .Values.platform.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-platform-config
            - secretRef:
                name: {{ .Release.Name }}-platform-secret
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ .Values.gcs.keyPath | quote }}
            {{- range .Values.platform.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - name: gcs-credentials
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: {{ .Values.platform.resources.requests.cpu | quote }}
              memory: {{ .Values.platform.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.platform.resources.limits.cpu | quote }}
              memory: {{ .Values.platform.resources.limits.memory | quote }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.platform.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.platform.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: gcs-credentials
          secret:
            secretName: {{ .Values.gcs.secretName }}

---
# =============================================================================
# Platform — Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    app: {{ .Release.Name }}-platform
  {{- if and .Values.platform.service.annotations (eq .Values.platform.service.type "LoadBalancer") }}
  annotations:
    {{- toYaml .Values.platform.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.platform.service.type }}
  ports:
    - name: {{ .Values.platform.metrics.portName }}
      port: {{ .Values.platform.service.port }}
      targetPort: {{ .Values.platform.service.port }}
      protocol: TCP
  selector:
    app: {{ .Release.Name }}-platform

{{- if and .Values.platform.metrics.enabled .Values.platform.metrics.podMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    app: {{ .Release.Name }}-platform
    {{- with .Values.platform.metrics.podMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-platform
  podMetricsEndpoints:
    - port: {{ .Values.platform.metrics.portName }}
      path: {{ .Values.platform.metrics.path }}
      interval: {{ .Values.platform.metrics.podMonitor.interval }}
      scrapeTimeout: {{ .Values.platform.metrics.podMonitor.scrapeTimeout }}
{{- end }}

{{- if and .Values.platform.metrics.enabled .Values.platform.metrics.alerts.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    app: {{ .Release.Name }}-platform
    {{- with .Values.platform.metrics.alerts.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ .Release.Name }}-platform
      rules:
        - alert: DataHubPlatformHighErrorRate
          expr: sum(rate(datahub_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(datahub_http_requests_total[5m])), 1) > {{ .Values.platform.metrics.alerts.errorRateThreshold }}
          for: {{ .Values.platform.metrics.alerts.duration }}
          labels:
            severity: warning
          annotations:
            summary: DataHub platform error rate is elevated
        - alert: DataHubPlatformHighLatency
          expr: max_over_time(datahub_http_request_duration_seconds_max[10m]) > {{ .Values.platform.metrics.alerts.latencyThresholdSeconds }}
          for: {{ .Values.platform.metrics.alerts.duration }}
          labels:
            severity: warning
          annotations:
            summary: DataHub platform latency is elevated
        - alert: DataHubPlatformPodRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",pod=~"{{ .Release.Name }}-platform-.*"}[15m]) > {{ .Values.platform.metrics.alerts.podRestartThreshold }}
          for: {{ .Values.platform.metrics.alerts.duration }}
          labels:
            severity: warning
          annotations:
            summary: DataHub platform pods are restarting
{{- end }}

{{- if .Values.platform.externalService.enabled }}
---
# =============================================================================
# Platform — External LoadBalancer Service (CLI/SDK 직접 접속용, 방화벽 필수)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-platform-external
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-platform
spec:
  type: LoadBalancer
  {{- with .Values.platform.externalService.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.platform.externalService.port | default 8080 }}
      targetPort: {{ .Values.platform.service.port }}
      protocol: TCP
  selector:
    app: {{ .Release.Name }}-platform
{{- end }}
{{- if .Values.platform.ingress.enabled }}
---
# =============================================================================
# Platform — Ingress
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    app: {{ .Release.Name }}-platform
  {{- with .Values.platform.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.platform.ingress.className }}
  {{- if .Values.platform.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.platform.ingress.host }}
      secretName: {{ .Values.platform.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.platform.ingress.host }}
      http:
        paths:
          - path: {{ .Values.platform.ingress.path | default "/api/v1" | quote }}
            pathType: {{ .Values.platform.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .Release.Name }}-platform
                port:
                  number: {{ .Values.platform.service.port }}
{{- end }}

{{- if .Values.platform.autoscaling.enabled }}
---
# =============================================================================
# Platform — HorizontalPodAutoscaler
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    app: {{ .Release.Name }}-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-platform
  minReplicas: {{ .Values.platform.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.platform.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.platform.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
