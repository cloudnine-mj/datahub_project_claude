{{- if .Values.postgresql.enabled }}
# =============================================================================
# PostgreSQL — initdb ConfigMap
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgresql-initdb
  labels:
    app: {{ .Release.Name }}-postgresql
data:
  initdb.sql: |
    -- Platform DB
    CREATE USER {{ .Values.postgresql.auth.platformUser }} WITH PASSWORD '{{ .Values.postgresql.auth.platformPassword }}';
    CREATE DATABASE {{ .Values.postgresql.auth.platformDatabase }} OWNER {{ .Values.postgresql.auth.platformUser }};

---
# =============================================================================
# PostgreSQL — PersistentVolumeClaim
# =============================================================================
{{- if .Values.postgresql.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    app: {{ .Release.Name }}-postgresql
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.postgresql.persistence.storageClass }}
  storageClassName: {{ .Values.postgresql.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size }}
{{- end }}

---
# =============================================================================
# PostgreSQL — Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    app: {{ .Release.Name }}-postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgresql
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgresql
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.auth.postgresPassword | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            {{- if .Values.postgresql.persistence.enabled }}
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.postgresql.resources.requests.cpu | quote }}
              memory: {{ .Values.postgresql.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.postgresql.resources.limits.cpu | quote }}
              memory: {{ .Values.postgresql.resources.limits.memory | quote }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: initdb
          configMap:
            name: {{ .Release.Name }}-postgresql-initdb
        {{- if .Values.postgresql.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-postgresql
        {{- end }}

---
# =============================================================================
# PostgreSQL — Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    app: {{ .Release.Name }}-postgresql
  {{- with .Values.postgresql.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.postgresql.service.type }}
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: 5432
      protocol: TCP
  selector:
    app: {{ .Release.Name }}-postgresql

---
# =============================================================================
# PostgreSQL — External LoadBalancer Service (방화벽 필수)
# =============================================================================
{{- if .Values.postgresql.externalService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql-external
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-postgresql
  annotations:
    {{- with .Values.postgresql.externalService.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: LoadBalancer
  {{- with .Values.postgresql.externalService.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.postgresql.externalService.port | default 5432 }}
      targetPort: 5432
      protocol: TCP
  selector:
    app: {{ .Release.Name }}-postgresql
{{- end }}

---
# =============================================================================
# PostgreSQL — NetworkPolicy (접근 제한)
# =============================================================================
{{- if .Values.postgresql.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgresql-access
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-postgresql
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        # 동일 네임스페이스 내 모든 Pod 허용
        - podSelector: {}
        {{- with .Values.postgresql.networkPolicy.additionalFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- end }}
