[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datahub-governance-api"
version = "0.1.0"
description = "DataHub Governance Web — backend API (FastAPI + SQLite)"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py310"
